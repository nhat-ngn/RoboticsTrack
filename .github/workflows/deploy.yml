name: Deploy to GitHub Pages

# Builds the static site and publishes packages/web/dist to GitHub Pages.
# One-time setup in the repo: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". Nothing else to configure — the app needs no
# secrets or environment variables, because all state lives in the browser.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: cd packages/web && bunx tsc --noEmit

      - name: Build
        run: bun run build:web

      # Hash routing means deep links never hit the server, but a stray
      # /some/path request should still land on the app rather than a 404.
      - name: Add SPA fallback
        run: cp packages/web/dist/index.html packages/web/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
